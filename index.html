<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form · alert & clear</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #dcf4f6;
        }
        .form-container {
            width: 100%;
            max-width: 500px;
            background-color: #c7f4f6;
            padding: 20px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
        .form-title {
            text-align: center;
            margin-bottom: 20px;
        }
        form {
            max-width: 400px;
            margin: auto;
            line-height: 1.5;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        .form-gender {
            display: inline-block;
            margin-right: 10px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        input[type="reset"] {
            background-color: #f44336;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="reset"]:hover {
            background-color: #da190b;
        }
        .form-btn {
            display: inline-block;
            margin-right: 80px;
        }
        /* small touch for alignment */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-top: 4px;
        }
        .btn-group .form-btn {
            margin-right: 0;
        }
        /* override for inline-block if needed */
        .form-btn {
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1 class="form-title">Registration form</h1>
    <div class="form-container">

        <form id="registrationForm" action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

            <span class="form-gender">Gender:</span>
            <input type="radio" id="male" name="gender" value="male" required>
            <label class="form-gender" for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female" required>
            <label class="form-gender" for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other" required>
            <label class="form-gender" for="other">Other</label>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            
            <div class="btn-group">
                <input class="form-btn" type="reset" value="Clear">
                <input class="form-btn" type="submit" value="Register">
            </div>
        </form>
    </div>

    <script>
        (function() {
            const form = document.getElementById('registrationForm');

            form.addEventListener('submit', function(event) {
                
                event.preventDefault();
                alert('Form submitted');
                form.reset();

            });

        })();
    </script>
</body>
</html>
