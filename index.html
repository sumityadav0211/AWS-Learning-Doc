<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AWS Complete Practical Guide</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

.app{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:300px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    overflow-y:auto;
    background:#111827;
    color:white;
    padding:18px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    padding:10px 5px 18px;
}

.logo span{
    color:#ff9900;
}

.progress{
    background:#1f2937;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.progressbar{
    height:8px;
    background:#374151;
    border-radius:10px;
    margin-top:8px;
    overflow:hidden;
}

.progressfill{
    height:100%;
    width:0%;
    background:#22c55e;
}

.search{
    width:100%;
    padding:11px;
    border:0;
    border-radius:7px;
    background:#374151;
    color:white;
    margin-bottom:12px;
}

.topic{
    padding:10px;
    border-radius:7px;
    margin-bottom:3px;
    cursor:pointer;
    font-size:14px;
    color:#d1d5db;
}

.topic:hover{
    background:#1f2937;
}

.topic.active{
    background:#ff9900;
    color:#111827;
    font-weight:bold;
}

.topic.completed::after{
    content:" ✓";
    color:#22c55e;
}

.topic.active.completed::after{
    color:#111827;
}

/* MAIN */

.main{
    margin-left:300px;
    width:calc(100% - 300px);
}

.topbar{
    height:65px;
    background:white;
    border-bottom:1px solid #ddd;
    position:sticky;
    top:0;
    z-index:5;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
}

.topbar h2{
    font-size:19px;
}

.darkbtn{
    background:#111827;
    color:white;
    border:0;
    border-radius:7px;
    padding:9px 15px;
    cursor:pointer;
}

.content{
    max-width:1100px;
    margin:auto;
    padding:30px;
}

/* HERO */

.hero{
    background:linear-gradient(135deg,#172554,#1d4ed8);
    color:white;
    padding:35px;
    border-radius:15px;
    margin-bottom:20px;
}

.hero h1{
    font-size:31px;
    margin-bottom:10px;
}

.hero p{
    line-height:1.7;
    color:#dbeafe;
}

/* CARD */

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.card h2{
    color:#172554;
    margin-bottom:15px;
}

.card h3{
    color:#1d4ed8;
    margin:20px 0 10px;
}

.card p,
.card li{
    line-height:1.7;
}

.card ul,
.card ol{
    padding-left:25px;
}

.card li{
    margin:5px 0;
}

/* STEP */

.step{
    border:1px solid #e5e7eb;
    border-radius:9px;
    margin:10px 0;
    overflow:hidden;
}

.step-title{
    background:#f8fafc;
    padding:14px;
    font-weight:bold;
    cursor:pointer;
}

.step-body{
    padding:16px;
    line-height:1.7;
}

.step-number{
    display:inline-block;
    background:#1d4ed8;
    color:white;
    width:28px;
    height:28px;
    border-radius:50%;
    text-align:center;
    line-height:28px;
    margin-right:8px;
}

/* COMMAND */

.command{
    background:#111827;
    color:#e5e7eb;
    padding:17px;
    border-radius:8px;
    margin:12px 0;
    font-family:monospace;
    white-space:pre-wrap;
    overflow-x:auto;
}

/* NOTE */

.note{
    background:#fff7ed;
    border-left:5px solid #f97316;
    padding:15px;
    margin:15px 0;
    border-radius:5px;
}

.success{
    background:#f0fdf4;
    border-left:5px solid #22c55e;
    padding:15px;
    margin:15px 0;
    border-radius:5px;
}

.warning{
    background:#fef2f2;
    border-left:5px solid #ef4444;
    padding:15px;
    margin:15px 0;
    border-radius:5px;
}

/* TABLE */

table{
    width:100%;
    border-collapse:collapse;
    margin:15px 0;
}

th,
td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

th{
    background:#eff6ff;
}

/* CHECKLIST */

.checklist{
    list-style:none!important;
    padding:0!important;
}

.checklist li{
    background:#f8fafc;
    padding:10px;
    border-radius:7px;
    margin:7px 0;
}

.checklist input{
    transform:scale(1.2);
    margin-right:8px;
}

/* NAV */

.navigation{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:25px;
}

.btn{
    border:0;
    background:#1d4ed8;
    color:white;
    padding:13px 20px;
    border-radius:8px;
    cursor:pointer;
}

.btn:hover{
    background:#1e40af;
}

.complete{
    background:#16a34a;
}

.complete:hover{
    background:#15803d;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.box{
    background:#f8fafc;
    border-left:4px solid #3b82f6;
    padding:16px;
    border-radius:8px;
}

/* DARK */

body.dark{
    background:#0f172a;
    color:#e5e7eb;
}

body.dark .topbar,
body.dark .card{
    background:#1e293b;
    color:#e5e7eb;
}

body.dark .card h2{
    color:#93c5fd;
}

body.dark .step-title,
body.dark .box,
body.dark .checklist li{
    background:#273449;
}

body.dark table th{
    background:#273449;
}

body.dark table td,
body.dark table th{
    border-color:#475569;
}

body.dark .note{
    background:#422006;
}

body.dark .success{
    background:#052e16;
}

body.dark .warning{
    background:#450a0a;
}

/* MOBILE */

@media(max-width:850px){

    .sidebar{
        width:230px;
    }

    .main{
        margin-left:230px;
        width:calc(100% - 230px);
    }

    .grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .app{
        display:block;
    }

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .main{
        margin-left:0;
        width:100%;
    }

    .content{
        padding:15px;
    }

}

</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">
☁️ <span>AWS</span> Practical Guide
</div>

<div class="progress">

<div>
Course Progress:
<strong id="progressText">0%</strong>
</div>

<div class="progressbar">
<div class="progressfill" id="progressFill"></div>
</div>

</div>

<input
class="search"
id="search"
placeholder="Search service..."
onkeyup="searchTopics()">

<div id="topics"></div>

</aside>


<main class="main">

<div class="topbar">

<h2 id="pageTitle">AWS Complete Practical Guide</h2>

<button class="darkbtn" onclick="darkMode()">
🌙 Dark Mode
</button>

</div>

<div class="content" id="content"></div>

</main>

</div>


<script>

/* =========================================================
AWS COURSE
========================================================= */

const data=[

/* INTRO */

{
id:"intro",
title:"01. AWS Roadmap",

html:`

<div class="hero">

<h1>AWS Complete Practical Roadmap</h1>

<p>
Learn AWS by creating real services instead of only watching
videos or reading theory.
</p>

</div>

<div class="card">

<h2>Learning Order</h2>

<div class="grid">

<div class="box">1. IAM</div>
<div class="box">2. AWS CLI</div>
<div class="box">3. EC2</div>
<div class="box">4. EBS</div>
<div class="box">5. AMI</div>
<div class="box">6. ELB</div>
<div class="box">7. Auto Scaling</div>
<div class="box">8. S3</div>
<div class="box">9. RDS</div>
<div class="box">10. DynamoDB</div>
<div class="box">11. Lambda</div>
<div class="box">12. CloudFormation</div>
<div class="box">13. Route 53</div>
<div class="box">14. CloudFront</div>
<div class="box">15. VPC</div>
<div class="box">16. Billing</div>
<div class="box">17. Amplify</div>
<div class="box">18. ECS</div>
<div class="box">19. EKS</div>
<div class="box">20. Terraform</div>
<div class="box">21. DNS</div>
<div class="box">22. SSL/TLS</div>

</div>

</div>

<div class="card">

<h2>Before Starting</h2>

<ul class="checklist">

<li>
<label>
<input type="checkbox">
Basic Linux knowledge
</label>
</li>

<li>
<label>
<input type="checkbox">
Basic networking
</label>
</li>

<li>
<label>
<input type="checkbox">
Basic SQL
</label>
</li>

<li>
<label>
<input type="checkbox">
Basic Git/GitHub
</label>
</li>

</ul>

</div>

<div class="warning">

AWS is a paid cloud platform. Always monitor your resources and
terminate resources you are no longer using.

</div>

`
},

/* IAM */

{
id:"iam",
title:"02. IAM - Identity & Access Management",

html:`

<div class="hero">

<h1>IAM</h1>

<p>
Manage users, permissions, policies and roles.
</p>

</div>

<div class="card">

<h2>What You Will Create</h2>

<ul>
<li>IAM User</li>
<li>IAM Group</li>
<li>IAM Policy</li>
<li>IAM Role</li>
<li>MFA</li>
</ul>

</div>

<div class="card">

<h2>Create IAM User</h2>

<div class="step">

<div class="step-title">
<span class="step-number">1</span>
Open IAM
</div>

<div class="step-body">

AWS Console → Search <b>IAM</b> → Open IAM.

</div>

</div>

<div class="step">

<div class="step-title">
<span class="step-number">2</span>
Create User
</div>

<div class="step-body">

IAM → Users → Create user.

Enter a username.

Example:

<div class="command">developer</div>

</div>

</div>

<div class="step">

<div class="step-title">
<span class="step-number">3</span>
Permissions
</div>

<div class="step-body">

For learning you can attach a suitable managed policy.

For production always follow least privilege.

</div>

</div>

<div class="step">

<div class="step-title">
<span class="step-number">4</span>
Enable MFA
</div>

<div class="step-body">

User → Security credentials → Multi-factor authentication.

Configure an authenticator application.

</div>

</div>

</div>

<div class="card">

<h2>Create IAM Role</h2>

<ol>

<li>IAM → Roles.</li>

<li>Click Create role.</li>

<li>Select trusted entity.</li>

<li>Select required permissions.</li>

<li>Give role a name.</li>

<li>Create role.</li>

</ol>

<h3>Example</h3>

<p>
An EC2 server can use an IAM role to access S3 without storing
access keys inside the server.
</p>

</div>

<div class="card">

<h2>Important Rule</h2>

<div class="warning">

Never put AWS secret access keys directly inside Java,
React, Python or other application source code.

</div>

</div>

`
},

/* CLI */

{
id:"cli",
title:"03. AWS CLI",

html:`

<div class="hero">

<h1>AWS CLI</h1>

<p>
Control AWS from Linux/macOS/Windows terminal.
</p>

</div>

<div class="card">

<h2>Install AWS CLI</h2>

<p>
Install the AWS CLI appropriate for your operating system from
the official AWS installer/documentation.
</p>

<h3>Check</h3>

<div class="command">
aws --version
</div>

</div>

<div class="card">

<h2>Configure</h2>

<div class="command">
aws configure
</div>

<p>Enter:</p>

<ul>
<li>Access Key ID</li>
<li>Secret Access Key</li>
<li>Default region</li>
<li>Output format</li>
</ul>

<h3>Example region</h3>

<div class="command">
ap-south-1
</div>

</div>

<div class="card">

<h2>Test CLI</h2>

<div class="command">
aws sts get-caller-identity
</div>

<p>
If your identity information appears, your CLI credentials are
working.
</p>

</div>

<div class="card">

<h2>Useful Commands</h2>

<div class="command">
aws s3 ls

aws ec2 describe-instances

aws iam list-users

aws rds describe-db-instances

aws dynamodb list-tables
</div>

</div>

`
},

/* EC2 */

{
id:"ec2",
title:"04. EC2 - Create Server",

html:`

<div class="hero">

<h1>EC2</h1>

<p>
Create your first AWS virtual server.
</p>

</div>

<div class="card">

<h2>What You Need</h2>

<ul>
<li>AMI</li>
<li>Instance type</li>
<li>Key pair</li>
<li>VPC</li>
<li>Subnet</li>
<li>Security group</li>
<li>EBS storage</li>
</ul>

</div>

<div class="card">

<h2>Step 1 — Open EC2</h2>

<div class="step">

<div class="step-title">
<span class="step-number">1</span>
Open EC2
</div>

<div class="step-body">

AWS Console → Search <b>EC2</b> → Open EC2.

Make sure you select the AWS Region you intend to use.

</div>

</div>

</div>

<div class="card">

<h2>Step 2 — Launch Instance</h2>

<div class="step">

<div class="step-title">
<span class="step-number">2</span>
Click Launch Instance
</div>

<div class="step-body">

EC2 Dashboard → Instances → Launch instance.

</div>

</div>

<div class="step">

<div class="step-title">
<span class="step-number">3</span>
Name
</div>

<div class="step-body">

Example:

<div class="command">
my-java-server
</div>

</div>

</div>

<div class="step">

<div class="step-title">
<span class="step-number">4</span>
Select AMI
</div>

<div class="step-body">

For learning you can select Amazon Linux or Ubuntu.

</div>

</div>

<div class="step">

<div class="step-title">
<span class="step-number">5</span>
Instance Type
</div>

<div class="step-body">

Select a suitable instance type for your workload.

For learning, choose a small eligible instance type available
under your account/region and review current pricing/free-tier
eligibility before launching.

</div>

</div>

</div>

<div class="card">

<h2>Step 3 — Create Key Pair</h2>

<div class="step">

<div class="step-title">
<span class="step-number">1</span>
Create key pair
</div>

<div class="step-body">

EC2 → Key pairs → Create key pair.

Example:

<div class="command">
my-ec2-key
</div>

Download the private key and store it securely.

</div>

</div>

<div class="step">

<div class="step-title">
<span class="step-number">2</span>
Linux/macOS permissions
</div>

<div class="step-body">

<div class="command">
chmod 400 my-ec2-key.pem
</div>

</div>

</div>

</div>

<div class="card">

<h2>Step 4 — Security Group</h2>

<p>
Create or select a security group.
</p>

<table>

<tr>
<th>Protocol</th>
<th>Port</th>
<th>Purpose</th>
</tr>

<tr>
<td>SSH</td>
<td>22</td>
<td>Linux administration</td>
</tr>

<tr>
<td>HTTP</td>
<td>80</td>
<td>Web application</td>
</tr>

<tr>
<td>HTTPS</td>
<td>443</td>
<td>Secure web application</td>
</tr>

<tr>
<td>Custom</td>
<td>8080</td>
<td>Example Java/Tomcat port</td>
</tr>

</table>

<div class="warning">

Do not expose administrative ports such as SSH to the entire
internet in production. Restrict source IPs where possible.

</div>

</div>

<div class="card">

<h2>Step 5 — Launch</h2>

<ol>

<li>Review settings.</li>

<li>Click Launch instance.</li>

<li>Wait until instance state is Running.</li>

<li>Wait for status checks to pass.</li>

</ol>

</div>

<div class="card">

<h2>Step 6 — Connect</h2>

<h3>Amazon Linux</h3>

<div class="command">
ssh -i my-ec2-key.pem ec2-user@PUBLIC_IP
</div>

<h3>Ubuntu</h3>

<div class="command">
ssh -i my-ec2-key.pem ubuntu@PUBLIC_IP
</div>

</div>

<div class="card">

<h2>Step 7 — Install Java</h2>

<p>Amazon Linux example:</p>

<div class="command">
sudo dnf update -y
sudo dnf install java-17-amazon-corretto -y
java -version
</div>

</div>

<div class="card">

<h2>Step 8 — Install Git</h2>

<div class="command">
sudo dnf install git -y

git --version
</div>

</div>

<div class="card">

<h2>Step 9 — Install Maven</h2>

<div class="command">
sudo dnf install maven -y

mvn -version
</div>

</div>

<div class="card">

<h2>EC2 Checklist</h2>

<ul class="checklist">

<li><label><input type="checkbox"> Create EC2</label></li>
<li><label><input type="checkbox"> Create key pair</label></li>
<li><label><input type="checkbox"> Configure security group</label></li>
<li><label><input type="checkbox"> Connect using SSH</label></li>
<li><label><input type="checkbox"> Install Java</label></li>
<li><label><input type="checkbox"> Install Git</label></li>
<li><label><input type="checkbox"> Install Maven</label></li>

</ul>

</div>

`
},

/* EBS */

{
id:"ebs",
title:"05. EBS - Storage",

html:`

<div class="hero">

<h1>EBS</h1>

<p>
Persistent block storage for EC2.
</p>

</div>

<div class="card">

<h2>Create EBS Volume</h2>

<ol>

<li>EC2 Console.</li>

<li>Elastic Block Store.</li>

<li>Volumes.</li>

<li>Create volume.</li>

<li>Select Availability Zone matching your EC2.</li>

<li>Select size.</li>

<li>Select volume type.</li>

<li>Create volume.</li>

</ol>

</div>

<div class="card">

<h2>Attach Volume</h2>

<ol>

<li>Select volume.</li>

<li>Actions.</li>

<li>Attach volume.</li>

<li>Select EC2 instance.</li>

<li>Attach.</li>

</ol>

</div>

<div class="card">

<h2>Linux Configuration</h2>

<h3>Find Disk</h3>

<div class="command">
lsblk
</div>

<h3>Format</h3>

<div class="command">
sudo mkfs -t xfs /dev/xvdf
</div>

<h3>Create Directory</h3>

<div class="command">
sudo mkdir /data
</div>

<h3>Mount</h3>

<div class="command">
sudo mount /dev/xvdf /data
</div>

<h3>Check</h3>

<div class="command">
df -h
</div>

</div>

<div class="card">

<h2>Create Snapshot</h2>

<ol>

<li>EC2 → Volumes.</li>

<li>Select volume.</li>

<li>Actions.</li>

<li>Create snapshot.</li>

<li>Enter description.</li>

<li>Create snapshot.</li>

</ol>

</div>

<div class="note">

EBS volume and EC2 instance generally need to be in the same
Availability Zone for direct attachment.

</div>

`
},

/* AMI */

{
id:"ami",
title:"06. AMI - Server Image",

html:`

<div class="hero">

<h1>AMI</h1>

<p>
Create a reusable image of an EC2 server.
</p>

</div>

<div class="card">

<h2>Why Create an AMI?</h2>

<p>

Suppose you install:

</p>

<ul>
<li>Java</li>
<li>Maven</li>
<li>Tomcat</li>
<li>Your application</li>
<li>Configuration</li>
</ul>

<p>

You can create an AMI and launch another server from that image.

</p>

</div>

<div class="card">

<h2>Create AMI</h2>

<ol>

<li>EC2 → Instances.</li>

<li>Select instance.</li>

<li>Actions.</li>

<li>Image and templates.</li>

<li>Create image.</li>

<li>Enter image name.</li>

<li>Create image.</li>

</ol>

</div>

<div class="card">

<h2>Launch From AMI</h2>

<ol>

<li>EC2 → AMIs.</li>

<li>Select your AMI.</li>

<li>Launch instance from AMI.</li>

<li>Select instance type.</li>

<li>Select key pair.</li>

<li>Configure security group.</li>

<li>Launch.</li>

</ol>

</div>

`
},

/* ELB */

{
id:"elb",
title:"07. Load Balancer",

html:`

<div class="hero">

<h1>Application Load Balancer</h1>

<p>
Distribute HTTP/HTTPS traffic across servers.
</p>

</div>

<div class="card">

<h2>Architecture</h2>

<div class="command">
Internet
   ↓
Application Load Balancer
   ↓
Target Group
   ↓
EC2
EC2
EC2
</div>

</div>

<div class="card">

<h2>Step 1 — Create Target Group</h2>

<ol>

<li>EC2 → Target Groups.</li>

<li>Create target group.</li>

<li>Target type → Instances.</li>

<li>Protocol → HTTP.</li>

<li>Port → 80 or your application port.</li>

<li>Select VPC.</li>

<li>Configure health check.</li>

<li>Register EC2 instances.</li>

<li>Create target group.</li>

</ol>

</div>

<div class="card">

<h2>Step 2 — Create Load Balancer</h2>

<ol>

<li>EC2 → Load Balancers.</li>

<li>Create Load Balancer.</li>

<li>Select Application Load Balancer.</li>

<li>Internet-facing.</li>

<li>Select VPC.</li>

<li>Select at least the required subnets.</li>

<li>Configure security group.</li>

<li>Create listener.</li>

<li>Forward traffic to target group.</li>

html:`

<div class="hero">

admin

</div>

</div>

<div class="card">

<h2>Step 7 — Create</h2>

<li>Click Create database.</li>

</ol>

</div>

</div>

{
id:"springboot",
title:"26. Deploy Spring Boot + RDS",

html:`

<div class="hero">

<h1>Real Project: Spring Boot + EC2 + RDS</h1>

<p>
Deploy a Java application connected to MySQL RDS.
</p>

</div>

<div class="card">

<h2>Architecture</h2>

<div class="command">
User
 ↓
Load Balancer
 ↓
EC2
 ↓
Spring Boot
 ↓
RDS MySQL
</div>

</div>

<div class="card">

<h2>Step 1 — Create RDS</h2>

<p>

Create the MySQL RDS database using the RDS instructions in
this guide.

</p>

</div>

<div class="card">

<h2>Step 2 — Configure Spring Boot</h2>

<p>Example configuration:</p>

<div class="command">
spring.datasource.url=jdbc:mysql://DATABASE_ENDPOINT:3306/demo_db

spring.datasource.username=admin

spring.datasource.password=YOUR_PASSWORD

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
</div>

<div class="warning">

For production, don't hard-code passwords in application source
or committed configuration files. Use a secure secret-management
approach.

</div>

</div>

<div class="card">

<h2>Step 3 — Build Application</h2>

<div class="command">
mvn clean package
</div>

<p>

This creates your JAR/WAR depending on the project configuration.

</p>

</div>

<div class="card">

<h2>Step 4 — Copy JAR to EC2</h2>

<div class="command">
scp -i my-key.pem target/app.jar ec2-user@PUBLIC_IP:/home/ec2-user/
</div>

</div>

<div class="card">

<h2>Step 5 — Run Application</h2>

<div class="command">
java -jar app.jar
</div>

</div>

<div class="card">

<h2>Step 6 — Test</h2>

<div class="command">
curl http://localhost:8080
</div>

<p>

If the application is configured for another port, use that port.

</p>

</div>

<div class="card">

<h2>Step 7 — Security Group</h2>

<p>

If testing directly from the internet, the relevant application
port must be allowed in the EC2 security group.

For production, prefer:

</p>

<div class="command">
Internet
   ↓
ALB :443
   ↓
EC2 application
</div>

</div>

<div class="card">

<h2>Step 8 — Run as Linux Service</h2>

<p>Create a systemd service file.</p>

<div class="command">
sudo nano /etc/systemd/system/myapp.service
</div>

<p>Example:</p>

<div class="command">
[Unit]
Description=My Spring Boot Application
After=network.target

[Service]
User=ec2-user
WorkingDirectory=/home/ec2-user
ExecStart=/usr/bin/java -jar /home/ec2-user/app.jar
Restart=always

[Install]
WantedBy=multi-user.target
</div>

<p>Then:</p>

<div class="command">
sudo systemctl daemon-reload

sudo systemctl enable myapp

sudo systemctl start myapp

sudo systemctl status myapp
</div>

</div>

<div class="success">

Now your Java application can run automatically when the EC2
server starts.

</div>

`

/* =========================================================
APPLICATION
========================================================= */

let current=0;

let completed=
JSON.parse(
localStorage.getItem("awsCompleted") || "{}"
);


/* RENDER SIDEBAR */

function renderTopics(filter=""){

const container=
document.getElementById("topics");

container.innerHTML="";

data.forEach((item,index)=>{

if(
filter &&
!item.title.toLowerCase()
.includes(filter.toLowerCase())
)return;

const div=
document.createElement("div");

div.className="topic";

if(index===current)
div.classList.add("active");

if(completed[item.id])
div.classList.add("completed");

div.textContent=item.title;

div.onclick=()=>{

current=index;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

};

container.appendChild(div);

});

}


/* RENDER PAGE */

function render(){

const item=data[current];

document.getElementById("pageTitle")
.textContent=item.title;

document.getElementById("content")
.innerHTML=`

${item.html}

<div class="navigation">

<button
class="btn"
onclick="previous()"
${current===0?"disabled":""}>
← Previous
</button>

<button
class="btn complete"
onclick="complete()">
✓ Mark Topic Complete
</button>

<button
class="btn"
onclick="next()"
${current===data.length-1?"disabled":""}>
Next →
</button>

</div>

<footer style="
text-align:center;
padding:30px;
color:#64748b;
">
Topic ${current+1} of ${data.length}
</footer>
`;

renderTopics();

updateProgress();

restoreChecks();

}


/* NEXT */

function next(){

if(current<data.length-1){

current++;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

}


/* PREVIOUS */

function previous(){

if(current>0){

current--;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

}


/* COMPLETE */

function complete(){

completed[data[current].id]=true;

localStorage.setItem(
"awsCompleted",
JSON.stringify(completed)
);

updateProgress();

renderTopics();

}


/* PROGRESS */

function updateProgress(){

const total=data.length;

const done=
Object.keys(completed).length;

const percent=
Math.round((done/total)*100);

document.getElementById("progressText")
.textContent=percent+"%";

document.getElementById("progressFill")
.style.width=percent+"%";

}


/* SEARCH */

function searchTopics(){

const value=
document.getElementById("search").value;

renderTopics(value);

}


/* DARK MODE */

function darkMode(){

document.body.classList.toggle("dark");

localStorage.setItem(
"awsDarkMode",
document.body.classList.contains("dark")
);

}


/* CHECKLIST STORAGE */

function restoreChecks(){

const boxes=
document.querySelectorAll(
'.checklist input[type="checkbox"]'
);

boxes.forEach((box,index)=>{

const key=
"aws-check-"+
current+
"-"+
index;

box.checked=
localStorage.getItem(key)==="true";

box.addEventListener(
"change",
()=>{

localStorage.setItem(
key,
box.checked
);

}
);

});

}


/* ACCORDION */

document.addEventListener(
"click",
function(e){

if(
e.target.classList.contains("step-title")
){

const body=
e.target.nextElementSibling;

if(body){

if(
body.style.display==="none"
){

body.style.display="block";

}else{

body.style.display="none";

}

}

}

});


/* KEYBOARD */

document.addEventListener(
"keydown",
function(e){

if(e.key==="ArrowRight")
next();

if(e.key==="ArrowLeft")
previous();

});


/* RESTORE DARK MODE */

if(
localStorage.getItem("awsDarkMode")==="true"
){

document.body.classList.add("dark");

}


/* START */

render();

</script>
